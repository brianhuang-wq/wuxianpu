name: 更新股價資料

on:
  schedule:
    # 06:20 UTC = 台北時間 14:20（台股 13:30 收盤後）
    - cron: '20 6 * * 1-5'
    # 21:30 UTC = 台北隔日 05:30（美股收盤後）
    - cron: '30 21 * * 1-5'
  workflow_dispatch:        # 也可在 Actions 頁面手動觸發
  push:
    paths:
      - 'tickers.txt'

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v5

      - name: 安裝 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安裝相依套件
        # --only-binary 只裝預編譯 wheel，避免安裝過程執行任意程式碼
        run: 'pip install --only-binary=:all: "numpy==2.3.5"'

      - name: 產生最新頁面
        run: python gen_standalone.py --output docs/index.html --tickers tickers.txt

      - name: 提交變更
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --staged --quiet; then
            echo "資料無變化，略過提交。"
          else
            git commit -m "自動更新股價資料 $(date -u +'%Y-%m-%d')"
            git push
          fi
